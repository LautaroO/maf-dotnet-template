name: Validate MAF plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate structure, fixtures, profiles and hygiene
        run: python3 scripts/validate-template.py
      - name: Check Python script syntax
        run: python3 -m compileall -q scripts
      - name: Test validator regressions
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell script syntax
        run: find skills -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --accept 200,429 './**/*.md'
          fail: true

