name: Audit official MAF sources

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maf-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit official sources and releases
        id: audit
        continue-on-error: true
        run: python3 scripts/audit-maf-sources.py --output "$RUNNER_TEMP/maf-source-audit.md" --json-output "$RUNNER_TEMP/maf-source-audit.json"
      - name: Synchronize new actionable findings
        if: always() && steps.audit.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-maf-audit-issue.py --audit-json "$RUNNER_TEMP/maf-source-audit.json" --report "$RUNNER_TEMP/maf-source-audit.md"
      - name: Preserve collector failure status
        if: always() && steps.audit.outcome == 'failure'
        run: exit 1
