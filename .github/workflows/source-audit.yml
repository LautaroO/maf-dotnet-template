name: Audit official MAF sources

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit official sources and releases
        id: audit
        continue-on-error: true
        run: python3 scripts/audit-maf-sources.py --output "$RUNNER_TEMP/maf-source-audit.md"
      - name: Open or refresh maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/maf-source-audit.md
        run: |
          issue_number="$(gh issue list --state open --search 'MAF source audit in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$REPORT"
            gh issue comment "$issue_number" --body "Scheduled audit refreshed for run $GITHUB_RUN_ID."
          else
            gh issue create --title "MAF source audit" --body-file "$REPORT"
          fi
